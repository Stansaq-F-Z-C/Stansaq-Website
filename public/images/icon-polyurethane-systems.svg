<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#1B1E20" stroke-width="3" stroke-linejoin="miter" stroke-linecap="square">
    <!-- funnel -->
    <polyline points="42,18 52,32 68,32 78,18"/>
    <line x1="42" y1="18" x2="78" y2="18"/>
    <!-- mold cavity (trapezoid, open top) -->
    <polyline points="30,60 38,100 82,100 90,60"/>
