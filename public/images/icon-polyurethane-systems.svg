  </g>
  <!-- pour stream -->
  <line x1="60" y1="32" x2="60" y2="60" stroke="#B08D4E" stroke-width="3"/>
  <!-- cured fill level with cross-hatch -->
  <g stroke="#B08D4E" stroke-width="1.5">
    <line x1="36" y1="76" x2="84" y2="76"/>
    <line x1="40" y1="68" x2="48" y2="76"/>
    <line x1="52" y1="68" x2="60" y2="76"/>
    <line x1="64" y1="68" x2="72" y2="76"/>
    <line x1="76" y1="68" x2="84" y2="76"/>
  </g>
  <rect x="36" y="76" width="48" height="24" fill="none" stroke="#1B1E20" stroke-width="1.5"/>
</svg>
